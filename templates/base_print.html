{% load static %}
<!doctype html>
<html lang="en" class="h-full bg-slate-100">
<head>
  <title>{% block title %}Print · {{ CLINIC_NAME }}{% endblock %}</title>
  {% include "partials/_head.html" %}
</head>
<body class="min-h-full bg-slate-100 font-sans text-slate-900 antialiased">
  <div class="no-print sticky top-0 z-20 border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-4xl items-center justify-between gap-4 px-4 py-3">
      <a href="{% block back_url %}{% url 'core:dashboard' %}{% endblock %}" class="btn btn-ghost btn-sm">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12l7.5-7.5M3 12h18" />
        </svg>
        Back
      </a>
      <button type="button" class="btn btn-primary btn-sm" onclick="window.print()">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.72 6.75V3.75h10.56v3M6.72 17.25H5.25a2.25 2.25 0 0 1-2.25-2.25v-5.25A2.25 2.25 0 0 1 5.25 7.5h13.5a2.25 2.25 0 0 1 2.25 2.25V15a2.25 2.25 0 0 1-2.25 2.25h-1.47M6.72 14.25h10.56v6H6.72v-6Z" />
        </svg>
        Print
      </button>
    </div>
  </div>

  <main class="mx-auto max-w-4xl px-4 py-8">
    <div class="print-page rounded-2xl border border-slate-200 bg-white p-8 shadow-card sm:p-10">
      {% block content %}{% endblock %}
    </div>
  </main>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
